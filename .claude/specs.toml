# Project Specs
#
# Living acceptance criteria for the project. Each spec describes something
# that should be true. Status is updated by the AI agent during sessions
# when asked to verify, or at session start.
#
# Statuses: pass | fail | unknown
# Areas: build, deploy, routing, feature

[[spec]]
id = "cargo-check"
area = "build"
description = "cargo check compiles for wasm32-unknown-unknown target"
check = "cargo check --target wasm32-unknown-unknown"
status = "pass"
updated = "2026-03-09"

[[spec]]
id = "cargo-clippy"
